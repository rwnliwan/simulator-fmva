<style>
  :root{--ink:#17203a;--muted:#5b6478;--bg:#f4f6fb;--card:#fff;--acc:#b45309;--accbg:#fef3c7;--ok:#15803d;--bad:#b91c1c;--line:#e2e8f0}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:20px}
  header.top{position:sticky;top:0;background:var(--ink);color:#fff;padding:10px 0;z-index:10}
  header.top .wrap{display:flex;justify-content:space-between;align-items:center}
  #timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem;background:#00000040;padding:6px 14px;border-radius:8px}
  #timer.danger{background:#7f1d1d}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 1px 3px #0001}
  .btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer;margin:6px 6px 6px 0}
  .btn.acc{background:var(--acc)} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.4;cursor:default}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:1rem}
  .opt:hover{border-color:var(--ink)} .opt.sel{border-color:var(--acc);background:var(--accbg)}
  .opt.review-correct{border-color:var(--ok);background:#dcfce7}
  .opt.review-wrong{border-color:var(--bad);background:#fee2e2}
  .tag{display:inline-block;font-size:.75rem;background:#eef2ff;color:#3730a3;border-radius:20px;padding:3px 10px;margin-bottom:8px}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
  .prog>div{height:100%;background:var(--acc);width:0%}
  table.case{border-collapse:collapse;margin:12px 0;width:100%}
  table.case td,table.case th{border:1px solid var(--line);padding:8px 12px;text-align:right}
  table.case td:first-child,table.case th:first-child{text-align:left}
  .nav{display:flex;justify-content:space-between;margin-top:16px}
  .flag{background:none;border:1px dashed var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .flag.on{border-color:var(--acc);color:var(--acc);border-style:solid}
  /* Modal konfirmasi submit in-page (pengganti confirm() native) — gaya sama seperti .card */
  .modal-backdrop{position:fixed;inset:0;background:#17203acc;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-backdrop.open{display:flex}
  .modal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:480px;width:100%;box-shadow:0 8px 30px #0003;text-align:center}
  .modal-card h3{margin-top:0}
  .modal-card .btn{margin:6px 6px 0 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:12px 0}
  /* SIM-4 fix: kartu pilihan mode pakai grid sendiri — .grid 38px untuk peta soal, bukan untuk kartu besar */
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
  .cell{border:1px solid var(--line);border-radius:8px;padding:8px 0;text-align:center;cursor:pointer;font-size:.85rem;background:#fff}
  .cell.done{background:#dbeafe}.cell.flagged{border-color:var(--acc);color:var(--acc);font-weight:700}.cell.cur{outline:2px solid var(--ink)}
  .score{font-size:3rem;font-weight:800}.pass{color:var(--ok)}.fail{color:var(--bad)}
  .small{color:var(--muted);font-size:.9rem}.glink{color:var(--acc);text-decoration:underline dotted;cursor:pointer}.exp{background:#f8fafc;border-left:4px solid var(--acc);padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0}
  table.case.left td,table.case.left th{text-align:left}
  footer{color:var(--muted);font-size:.8rem;text-align:center;padding:24px}
</style>

<tr><td>Tawaran untuk ekuitas</td><td>550</td></tr></table>`;
const Q = [
 // ===== FINANCIAL MODELING (6) =====

 {t:"Financial Modeling",q:"Best practice: sel input/asumsi (hardcode) sebaiknya…",o:["Dicampur di semua rumus agar ringkas","Dikumpulkan di area/tab asumsi dengan format khusus (mis. biru)","Disembunyikan agar model terlihat bersih","Diketik ulang di setiap rumus"],a:1,e:"Satu sumber asumsi + format biru = audit mudah. Ini konvensi standar industri."},
 {t:"Financial Modeling",q:"Neraca tidak balance. Cek tercepat pertama yang dilakukan auditor model?",o:["Cek satu-satu tiap sel","Buat baris cek: Total Aset − Liabilitas − Ekuitas = 0 per periode","Hapus dan bangun ulang","Ubah angka sampai balance"],a:1,e:"Baris balance-check per periode langsung menunjukkan di periode mana selisih mulai muncul."},
 {t:"Financial Modeling",q:"PP&E awal Rp500 jt, capex Rp100 jt, depresiasi Rp20 jt. PP&E akhir?",o:["Rp580 jt","Rp600 jt","Rp520 jt","Rp420 jt"],a:0,e:"Saldo akhir = awal + capex − depresiasi = 500 + 100 − 20 = 580."},
 {t:"Financial Modeling",q:"Rumus Free Cash Flow to Firm (FCFF) yang benar:",o:["Laba bersih + depresiasi − capex","NOPAT + depresiasi − capex − perubahan modal kerja","EBITDA − pajak − dividen","Arus kas operasi + arus kas pendanaan"],a:1,e:"FCFF = NOPAT + D&A − Capex − ΔNWC. Mengukur kas untuk semua investor."},
 // ===== VALUATION (6) =====
 {t:"Valuation",q:"Enterprise Value (EV) = …",o:["Harga saham × jumlah saham","Equity value + net debt","Total aset − total liabilitas","Market cap − kas"],a:1,e:"EV = nilai ekuitas + utang bersih. EV milik semua investor; market cap hanya pemegang saham."},
 {t:"Valuation",q:"Jika WACC naik (asumsi lain tetap), nilai hasil DCF akan…",o:["Naik","Turun","Tetap","Naik lalu turun"],a:1,e:"Diskonto lebih besar → present value lebih kecil. Hubungan terbalik."},
 {t:"Valuation",q:"EV/EBITDA 8,0× dan EBITDA Rp250 miliar. Enterprise value?",o:["Rp2,0 triliun","Rp31,25 miliar","Rp258 miliar","Rp242 miliar"],a:0,e:"EV = 8,0 × 250 miliar = Rp2 triliun."},
 {t:"Valuation",q:"CAPM: risk-free 6%, beta 1,2, market risk premium 5%. Cost of equity?",o:["11,0%","12,0%","13,2%","17,0%"],a:1,e:"Ke = 6% + 1,2 × 5% = 12%."},
 {t:"Valuation",q:"Terminal value (Gordon growth): FCF tahun depan Rp100 M, g=3%, WACC=10%. TV?",o:["Rp1.000 M","Rp1.471 M","Rp1.429 M","Rp3.333 M"],a:2,e:"Soal memberi FCF TAHUN DEPAN (CF1). TV = CF1/(WACC−g) = 100/0,07 ≈ Rp1.429 M. Rp1.471 M = jebakan double-growth (mengalikan 1,03 lagi)."},
 {t:"Valuation",q:"Manakah yang BUKAN metodologi valuasi utama?",o:["DCF analysis","Comparable company analysis","Precedent transactions","Melihat rasio saja tanpa menghitung nilai"],a:3,e:"Rasio tanpa kesimpulan nilai bukan valuasi. Tiga metode utama: DCF, comps, precedents."},
 // ===== FINANCE (2) =====
 {t:"Finance",q:"Dua proyek mutually exclusive: A NPV lebih tinggi, B IRR lebih tinggi. Pilih…",o:["B (IRR lebih tinggi)","A (NPV lebih tinggi)","Yang payback lebih cepat","Undi"],a:1,e:"NPV mengukur nilai absolut dalam rupiah. IRR bisa menyesatkan karena asumsi reinvestment."},
 {t:"Finance",q:"Kelemahan utama payback period?",o:["Sulit dihitung","Mengabaikan time value of money dan arus kas setelah payback","Butuh data terlalu banyak","Tidak bisa untuk proyek rugi"],a:1,e:"Payback mengabaikan kapan uang datang dan apa yang terjadi setelah modal kembali."},

 {t:"Accounting",q:"Kenaikan piutang usaha (receivable) berdampak ke arus kas operasi…",o:["Menambah","Mengurangi","Tidak berpengaruh","Menambah dua kali"],a:1,e:"Piutang naik = jualan belum jadi kas → penyesuaian negatif di operating cash flow."},
 // ===== EXCEL (2) =====
 {t:"Excel",q:"Perbedaan XNPV vs NPV?",o:["XNPV lebih cepat","XNPV memakai tanggal aktual tiap arus kas (tak harus periodik)","Tidak ada beda","NPV hanya untuk bulanan"],a:1,e:"NPV asumsikan periode sama; XNPV mendiskonto per tanggal aktual — wajib untuk arus kas tak beraturan."},
 {t:"Excel",q:"Keunggulan INDEX-MATCH dibanding VLOOKUP?",o:["Lebih pendek ditulis","Bisa lookup ke kiri dan tahan terhadap insert kolom","Selalu lebih cepat","Bisa tanpa tabel"],a:1,e:"VLOOKUP hanya cari ke kanan dan rusak jika kolom disisipkan; INDEX-MATCH tidak."},
 // ===== BUDGETING (1) =====
 {t:"Budgeting & Forecasting",q:"Untuk pos beban, variance disebut favorable jika…",o:["Aktual > anggaran","Aktual < anggaran","Aktual = anggaran","Anggaran = 0"],a:1,e:"Beban di bawah anggaran = hemat = favorable. Untuk pendapatan sebaliknya."},
 // ===== PRESENTATION (1) =====
 {t:"Presentation & Visuals",q:"Menunjukkan komposisi margin selama 5 tahun — chart terbaik?",o:["Pie chart per tahun","Stacked bar/area chart","Scatter plot","Gauge chart"],a:1,e:"Pie per tahun memaksa banding antar-gambar; stacked bar/area menunjukkan tren komposisi sekaligus."},
 // ===== CASE STUDY (3) =====
 {t:"Case Study",case:true,q:"Kasus: PT Maju Bersama (Rp juta). Pendapatan 2023: 10.000, 2024: 12.000. HPP 2023: 6.000, 2024: 7.800. Beban operasi 2023: 2.000, 2024: 2.200. — Berapa gross margin 2024?",o:["40,0%","35,0%","30,0%","50,0%"],a:1,e:"(12.000−7.800)/12.000 = 4.200/12.000 = 35%."},
 {t:"Case Study",case:true,q:"Kasus yang sama — pertumbuhan pendapatan YoY 2024?",o:["16,7%","20,0%","25,0%","12,0%"],a:1,e:"(12.000−10.000)/10.000 = 20%."},
 {t:"Case Study",case:true,q:"Kasus yang sama — operating profit 2024 vs 2023?",o:["Naik dari 2.000 ke 2.400","Tetap 2.000 (flat)","Turun ke 1.800","Naik ke 2.200"],a:1,e:"2024: 12.000−7.800−2.200 = 2.000. 2023: 10.000−6.000−2.000 = 2.000. Pendapatan naik tapi margin tergerus — temuan analis."},
// ===== FINANCIAL MODELING (+8 → total 14) =====
 {t:"Financial Modeling",q:"Proyeksi driver-based: tahun ini 12.000 unit × Rp10.000 = Rp120 jt. Tahun depan volume +10%, harga +5%. Pendapatan proyeksi?",o:["Rp138,6 jt","Rp132,0 jt","Rp138,0 jt","Rp126,0 jt"],a:0,e:"13.200 unit × Rp10.500 = Rp138,6 jt. Driver dikali, bukan dijumlah persennya (1,10×1,05=1,155)."},
 {t:"Financial Modeling",q:"Piutang usaha Rp30 jt, pendapatan tahunan Rp360 jt. Days Sales Outstanding (DSO)?",o:["30 hari","12 hari","120 hari","365 hari"],a:0,e:"DSO = 30/360 × 365 ≈ 30 hari. Artinya rata-rata pelanggan membayar 30 hari setelah penjualan."},
 {t:"Financial Modeling",q:"Untuk melihat bagaimana laba berubah pada 10 nilai asumsi pertumbuhan yang berbeda, tool Excel yang tepat?",o:["Goal Seek","Data Table (What-If Analysis)","PivotTable","VLOOKUP"],a:1,e:"Data Table menjalankan ulang rumus untuk tiap nilai asumsi — inti analisis sensitivitas satu/dua variabel."},
 {t:"Financial Modeling",q:"Biaya Rp50 jt yang memperpanjang umur mesin 5 tahun dicatat sebagai…",o:["Beban operasi tahun berjalan","Capex (dikapitalisasi, disusutkan 5 tahun)","Pengurang pendapatan","Modal kerja"],a:1,e:"Manfaat lebih dari 1 tahun → dikapitalisasi sebagai aset lalu disusutkan. Langsung dibebankan membuat laba tahun ini understated."},
 {t:"Financial Modeling",q:"Metode declining balance vs garis lurus (straight-line): beban depresiasi…",o:["Sama tiap tahun pada keduanya","Lebih besar di tahun-tahun awal pada declining balance","Lebih besar di tahun-tahun awal pada garis lurus","Nol di tahun pertama keduanya"],a:1,e:"Declining balance = tarif × nilai buku yang menyusut → beban besar di awal, kecil di akhir. Garis lurus rata tiap tahun."},
 {t:"Financial Modeling",q:"Persediaan naik Rp10 jt, utang usaha naik Rp4 jt (lainnya tetap). Perubahan modal kerja bersih (ΔNWC)?",o:["+Rp6 jt","−Rp6 jt","+Rp14 jt","Rp0"],a:0,e:"ΔNWC = Δaset lancar − Δliabilitas lancar = 10 − 4 = +6. NWC naik = kas terikat → arus kas operasi turun Rp6 jt."},
 {t:"Financial Modeling",q:"Konvensi 'mid-year' dalam DCF mengasumsikan…",o:["Arus kas diterima di akhir tahun","Arus kas diterima merata — didiskon setengah periode lebih awal","Diskon dihitung tengah malam","Tahun fiskal dimulai Juli"],a:1,e:"Arus kas tidak menunggu 31 Desember — mid-year mendiskon tiap tahun setengah periode lebih awal sehingga valuasi sedikit lebih tinggi."},
 {t:"Financial Modeling",q:"Laba ditahan awal Rp200 jt, laba bersih Rp60 jt, dividen Rp20 jt. Laba ditahan akhir?",o:["Rp240 jt","Rp220 jt","Rp260 jt","Rp180 jt"],a:0,e:"200 + 60 − 20 = 240. Link wajib 3-statement: laba bersih masuk ke ekuitas melalui laba ditahan."},
// ===== VALUATION (+8 → total 14) =====
 {t:"Valuation",q:"FCF Rp100 M tumbuh 10%/tahun selama 3 tahun, lalu 3% selamanya. WACC 12%. Enterprise value?",o:["Rp1.374 M","Rp1.342 M","Rp1.523 M","Rp1.813 M"],a:0,e:"PV FCF tahun 1–3: 98,2 + 96,5 + 94,7. TV = 133,1×1,03/0,09 = 1.523 → PV-nya 1.084. Total ≈ Rp1.374 M."},
 {t:"Valuation",q:"Ekuitas Rp600 M (Ke 14%), utang Rp400 M (Kd 8%, pajak 25%). WACC?",o:["10,8%","11,6%","10,0%","12,2%"],a:0,e:"0,6×14% + 0,4×8%×(1−0,25) = 8,4 + 2,4 = 10,8%. Biaya utang dihitung setelah pajak."},
 {t:"Valuation",q:"Utang berbunga Rp500 M, kas Rp120 M. Net debt?",o:["Rp380 M","Rp500 M","Rp620 M","Rp120 M"],a:0,e:"Net debt = utang − kas = 380. EV dikurangi net debt menjadi equity value."},
 {t:"Valuation",q:"EV Rp2.000 M, net debt Rp380 M. Equity value?",o:["Rp1.620 M","Rp2.380 M","Rp2.000 M","Rp1.880 M"],a:0,e:"Equity value = EV − net debt = 1.620. Jembatan standar dari enterprise value ke equity value."},
 {t:"Valuation",q:"Median EV/EBITDA perusahaan pembanding 7,5×; EBITDA target Rp300 M. Implied EV?",o:["Rp2.250 M","Rp40 M","Rp307,5 M","Rp292,5 M"],a:0,e:"7,5 × 300 = 2.250. Pilih pembanding yang benar-benar sepadan — multiple tanpa konteks menyesatkan."},
 {t:"Valuation",q:"Precedent transactions biasanya menghasilkan multiple lebih tinggi dari trading comps karena…",o:["Datanya lebih baru","Mencakup premium pengendalian (control premium) akuisisi","Perusahaannya lebih besar","Metodenya berbeda"],a:1,e:"Harga akuisisi = harga saham + premium kendali (umumnya 20–40%). Trading comps = harga minoritas tanpa premium."},

 {t:"Valuation",q:"FCFF Rp100 M, beban bunga Rp20 M, pajak 25%, net borrowing Rp10 M. FCFE?",o:["Rp95 M","Rp90 M","Rp110 M","Rp85 M"],a:0,e:"FCFE = 100 − 20×0,75 + 10 = 95. FCFF milik semua investor; FCFE hanya milik pemegang saham."},

 {t:"Finance",q:"Risiko yang BISA dihilangkan dengan diversifikasi portofolio?",o:["Risiko pasar (systematic)","Risiko spesifik perusahaan (unsystematic)","Risiko suku bunga","Risiko inflasi"],a:1,e:"Risiko idiosinkratik (manajemen, produk) terdiversifikasi habis. Risiko sistematis tetap — itu yang dihargai pasar."},

let _xlsxLib = null, _zipLib = null;
function wbEnsureLib(cb){
  if(_xlsxLib && _zipLib) return cb();
  const s = document.createElement('script');
  s.crossOrigin = "anonymous";
  s.onerror = ()=>{
    // JSZip gagal dimuat: lanjut tanpa normalisasi namespace (file biasa tetap jalan).
    if(!_zipLib){ _zipLib = 'failed'; wbEnsureLib(cb); return; }
    document.getElementById('casecheck').innerHTML = "⚠️ Gagal memuat library. Cek koneksi lalu coba lagi.";
  };
  if(!_zipLib){
    s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
    s.integrity = "sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG";
    s.onload = ()=>{ _zipLib = true; wbEnsureLib(cb); };
  }else{
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.integrity = "sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw";
    s.onload = ()=>{ _xlsxLib = true; cb(); };
  }
  document.head.appendChild(s);
}
// Normalisasi prefix namespace (mis. ns0:) di XML sheet sebelum XLSX.read —
// SheetJS 0.18.5 tidak mengenali tag ber-prefix (mis. <ns0:f t="shared">) sehingga
// metadata rumus hilang dan selnya terbaca sebagai ketikan. File tanpa prefix
// dikembalikan apa adanya (tanpa perubahan isi).
async function normalizeXlsxNamespaces(buf){
  if(typeof JSZip === 'undefined') return buf;
  try{
    const zip = await JSZip.loadAsync(buf);
    let changed = false;
    const jobs = [];
    zip.forEach((path, entry)=>{
      if(/^xl\/worksheets\/[^/]+\.xml$/.test(path)){
        jobs.push(entry.async('string').then(txt=>{
          if(/<\/?ns\d+:/.test(txt)){
            zip.file(path, txt.replace(/<\/?ns\d+:/g, m => m.charAt(1)==='/' ? '</' : '<'));
            changed = true;
          }
        }));
      }
    });
    await Promise.all(jobs);
    if(!changed) return buf;
    return await zip.generateAsync({type:'arraybuffer'});
  }catch(e){ return buf; }
}
function checkCaseFile(){
  const inp = document.getElementById('casefile');
  const out = document.getElementById('casecheck');
  if(!inp.files.length){ out.innerHTML = "Pilih file .xlsx dulu."; return; }
  out.innerHTML = "Membaca…";
  wbEnsureLib(()=>{
    const rd = new FileReader();
    rd.onload = async e=>{
      try{
        const buf = await normalizeXlsxNamespaces(e.target.result);
        // sheetStubs:true — pertahankan sel rumus tanpa nilai tersimpan sebagai stub
        // (t:'z'); tanpanya SheetJS MEMBUANG sel tersebut dan rumusnya tak terdeteksi.
        const wb = XLSX.read(buf, {type:'array', sheetStubs:true});
        const ws = wb.Sheets['MODEL'];
        if(!ws){ out.innerHTML = "⚠️ Sheet <b>MODEL</b> tidak ditemukan."; return; }
        // Baca nilai langsung dari objek sel (bukan sheet_to_json): sheet_to_json
        // melempar "unrecognized type shared" untuk file Excel berisi shared formula
        // (drag-fill) — dan objek selnya juga dibutuhkan untuk cek rumus (.f).
        const ref = XLSX.utils.decode_range(ws['!ref']);
        const rows = [];
        for(let r=ref.s.r; r<=ref.e.r; r++){
          const row = [];
          for(let c=ref.s.c; c<=ref.e.c; c++){
            const cell = ws[XLSX.utils.encode_cell({r:r, c:c})];
            row.push(cell ? cell.v : null);
          }
          rows.push(row);
        }
        const lab = {};
        rows.forEach((r,i)=>{ if(typeof r[0]==='string' && !(r[0].trim() in lab)) lab[r[0].trim()] = i; });
        const num = v => (typeof v==='number') ? v : (typeof v==='string' ? parseFloat(v.replace(/[^0-9.\-]/g,'')) : NaN);
        const TOL = 0.011 * 1000; // toleransi Rp11 jt untuk output biasa (angka dalam Rp juta)
        const TOL_BAL = 1; // SIM-3 fix: toleransi KETAT untuk balance-check (harus ≈0): Rp1 juta. Terpisah dari TOL output.
        // Sel kunci WAJIB rumus (bukan ketikan): baca objek sel langsung — sheet_to_json
        // membuang info rumus. .f = rumus per-sel; t:"shared" = anggota shared formula
        // Excel (drag-fill) — SheetJS 0.18.5 tidak mengembangkan shared formula ke .f.
        const cellAt = (ri, ci) => (ri===undefined || ci===undefined) ? undefined : ws[XLSX.utils.encode_cell({r:ri, c:ci})];
        const hasFormula = cell => !!(cell && ((typeof cell.f === 'string' && cell.f !== '') || cell.t === 'shared'));
        const checks = [
          ["Pendapatan 2026", lab["Pendapatan"], 1, 151800],
          ["EBIT 2026", lab["EBIT"], 1, 22860],
          ["Laba bersih 2026", lab["Laba bersih"], 1, 16270.8],
          ["NWC 2028", lab["NWC"], 3, 33062.04],
          ["CFO 2026", lab["Arus kas operasi (CFO)"], 1, 21286.8],
          ["Kas akhir 2028", lab["Kas akhir"], 3, 52261.41],
          ["FCFF 2027", lab["FCFF"], 2, 15576.48],
          ["Cek A−L−E 2026", lab["Cek: A − L − E (harus 0)"], 1, 0],
          ["Cek A−L−E 2027", lab["Cek: A − L − E (harus 0)"], 2, 0],
          ["Cek A−L−E 2028", lab["Cek: A − L − E (harus 0)"], 3, 0],
        ];
        // sel nilai tunggal (TV/EV/ekuitas/saham): cari di kolom B–D baris label
        // Terima juga sel rumus tanpa nilai tersimpan (stub t:'z' tanpa v): tanpanya,
        // EV/pps pada file rumus-belum-tercalculate akan terbaca "kosong" karena
        // single() hanya mencari nilai numerik.
        const single = (label)=>{
          const i = lab[label]; if(i===undefined) return {v:NaN, cell:undefined};
          for(const c of [1,2,3]){ const cell = cellAt(i,c); const v = num(rows[i][c]); if(!isNaN(v) || hasFormula(cell)) return {v, cell}; }
          return {v:NaN, cell:undefined};
        };
        const ev = single("Enterprise value (DCF)");
        const pps = single("Nilai per saham");
        checks.push(["Enterprise value (DCF)", null, null, 192388.65, ev.v, ev.cell]);
        checks.push(["Nilai per saham", null, null, 3547.77, pps.v, pps.cell]);
        let ok = 0, uncached = 0, h = "<table class='case'><tr><th>Sel kunci</th><th>Nilai (Rp juta)</th><th></th><th>Keterangan</th></tr>";
        checks.forEach(c=>{
          const [name, ri, ci, exp, pre, preCell] = c;
          const got = (pre!==undefined) ? pre : (ri===undefined ? NaN : num(rows[ri][ci]));
          const cell = (preCell!==undefined) ? preCell : cellAt(ri, ci);
          const tol = (exp===0) ? TOL_BAL : Math.max(TOL, Math.abs(exp)*0.0005);
          const valOk = !isNaN(got) && Math.abs(got-exp) <= tol;
          const formulaOk = hasFormula(cell);
          // Sel rumus tanpa nilai tersimpan (stub t:'z', v:0 dari SheetJS): nilainya tidak
          // bisa diverifikasi, tapi rumusnya ADA — bedakan dari sel kosong. Tanpa ini,
          // sel balance-check (exp 0) yang rumusnya belum ter-calculate akan lolos palsu.
          const noSavedValue = !!(cell && formulaOk && cell.t === 'z');
          const pass = valOk && formulaOk && !noSavedValue;
          if(pass) ok++;
          let note;
          if(noSavedValue){ note = "rumus ada, tapi nilai tersimpan tidak ada — recalculate &amp; save dulu sebelum upload · <span lang=\"en\">formula present, but no saved value — recalculate &amp; save before uploading</span>"; uncached++; }
          else if(isNaN(got)) note = "kosong — sel belum diisi";
          else if(!valOk) note = "nilai salah — harusnya " + exp.toLocaleString('id-ID');
          else if(!formulaOk) note = "angka benar tapi masih KETIKAN — studi kasus ini menuntut rumus";
          else note = "rumus ✓, nilai ✓";
          h += `<tr><td>${name}</td><td>${(noSavedValue||isNaN(got))?"—":got.toLocaleString('id-ID')}</td><td>${pass?"✅":"❌"}</td><td>${note}</td></tr>`;
        });
        h += `</table><p><strong>${ok}/${checks.length}</strong> sel kunci cocok.${ok===checks.length?" 🎉 Output cocok! (checker memverifikasi angka dan rumus.)":" Periksa sel bertanda ❌."}</p>`;
        if(uncached>0) h += `<p>⚠️ ${uncached} sel punya rumus tapi nilainya tidak tersimpan di file — rumus terdeteksi, tapi checker membaca nilai tersimpan, bukan menghitung ulang rumus. Di Excel/Sheets: recalculate lalu Save/Download, lalu upload lagi. · <span lang="en">${uncached} cell${uncached>1?'s':''} ${uncached>1?'have':'has'} formulas but no saved values — the checker reads saved values, it does not recalculate formulas. In Excel/Sheets: recalculate, then Save/Download, then upload again.</span></p>`;
        out.innerHTML = h;
      }catch(err){ out.innerHTML = "⚠️ Gagal membaca file: " + String(err).slice(0,120); }
    };
    rd.readAsArrayBuffer(inp.files[0]);
  });
}

/* Tabel exhibit soal case — dipakai renderQ (saat menjawab) dan review() (Pembahasan) agar tampilannya sama */
function exhibitHTML(q){
  if(q.case!==true) return "";
  return q.exhibit || `<table class="case"><tr><th>PT Maju Bersama (Rp juta)</th><th>2023</th><th>2024</th></tr>
    <tr><td>Pendapatan</td><td>10.000</td><td>12.000</td></tr>
    <tr><td>HPP</td><td>6.000</td><td>7.800</td></tr>
    <tr><td>Beban operasi</td><td>2.000</td><td>2.200</td></tr></table>`;
}
function renderQ(){
  const qi = order[cur], q = QS[qi];
  const optOrder = q._oo || (q._oo = shuffle(q.o.map((_,i)=>i)));
  let h = `<div class="card">
    <span class="tag">${q.t}${q.case?" · Studi Kasus":""}</span>
    <div class="prog"><div style="width:${Math.round(cur/QS.length*100)}%"></div></div>
    <p class="small">Soal ${cur+1} dari ${QS.length}</p>
    <h2 style="font-size:1.15rem">${q.q}</h2>`;
  h += exhibitHTML(q);
  optOrder.forEach(oi=>{
    h += `<button class="opt ${ans[qi]===oi?'sel':''}" onclick="pick(${oi})">${String.fromCharCode(65+optOrder.indexOf(oi))}. ${q.o[oi]}</button>`;
  });
  h += `<div class="nav">
    <button class="btn ghost" onclick="go(-1)" ${cur===0?'disabled':''}>← Kembali</button>
    <button class="flag ${flagged.has(qi)?'on':''}" onclick="flag()">⚑ ${flagged.has(qi)?'Ditandai':'Tandai ragu'}</button>
    <button class="btn" onclick="go(1)" ${cur===QS.length-1?'disabled':''}>Lanjut →</button>
  </div>
  <button class="btn ghost" onclick="overview()">Peta Soal</button>
  <button class="btn acc" onclick="submit(false)">Selesai &amp; Nilai</button></div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
}
function pick(oi){ ans[order[cur]] = oi; renderQ(); }
function go(d){ cur=Math.min(QS.length-1,Math.max(0,cur+d)); renderQ(); }
function flag(){ const qi=order[cur]; flagged.has(qi)?flagged.delete(qi):flagged.add(qi); renderQ(); }
function overview(){
  let h = `<div class="card"><h2>Peta Soal</h2><div class="grid">`;
  order.forEach((qi,i)=>{
    h += `<div class="cell ${i===cur?'cur':''} ${ans[qi]!==undefined?'done':''} ${flagged.has(qi)?'flagged':''}" onclick="cur=${i};renderQ()">${i+1}</div>`;
  });
  h += `</div><button class="btn" onclick="renderQ()">Kembali</button>
  <button class="btn acc" onclick="submit(false)">Selesai &amp; Nilai</button></div>`;
  app.innerHTML = h;
}
/* Modal konfirmasi submit in-page (pengganti confirm() native).
   Auto-submit (timer habis) memanggil submit(true) langsung dan tidak pernah menyentuh modal. */
function openSubmitModal(un){
  document.getElementById('submitModalCount').innerHTML =
    `<strong>${un} soal</strong> belum dijawab. · <span lang="en"><strong>${un} question${un>1?'s':''}</strong> unanswered.</span>`;
  document.getElementById('submitModal').classList.add('open');
}
function closeSubmitModal(){ document.getElementById('submitModal').classList.remove('open'); }
function confirmSubmitModal(){ closeSubmitModal(); submit(true,false); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSubmitModal(); });
function submit(auto, timedOut){
  if(submitted) return;
  closeSubmitModal(); // tutup modal bila masih terbuka (mis. timer habis saat modal tampil)
  if(!auto){
    const un = order.filter(qi=>ans[qi]===undefined).length;
    if(un>0){ openSubmitModal(un); return; }
  }
  submitted=true; clearInterval(timerInt); timerEl.style.display='none';
  let correct=0; const byTopic={};
  order.forEach(qi=>{
    const q=QS[qi], ok = ans[qi]===q.a;
    if(ok) correct++;
    byTopic[q.t]=byTopic[q.t]||{c:0,n:0};
    byTopic[q.t].n++; if(ok) byTopic[q.t].c++;
  });
  const score = Math.round(correct/QS.length*100);
  const _bk = QS_MODE==='case' ? 'fmva_case_best' : 'fmva_sim_best';
  const best = +(_bk?localStorage.getItem(_bk):0);
  if(score>best) localStorage.setItem(_bk,score);
  let h = `<div class="card" style="text-align:center">
    <p class="small">${(auto&&timedOut)?"Waktu habis — otomatis dinilai":"Ujian selesai"}</p>
    <div class="score ${score>=PASS_MARK?'pass':'fail'}">${score}%</div>
    <p><strong class="${score>=PASS_MARK?'pass':'fail'}">${score>=PASS_MARK?"LULUS 🎉":"BELUM LULUS"}</strong> — benar ${correct} dari ${QS.length} (syarat ${PASS_MARK}%)</p>
    <h3 style="text-align:left">Bedah per topik</h3><table class="case">`;
  let anyWeak=false;
  Object.entries(byTopic).forEach(([t,v])=>{
    const p=Math.round(v.c/v.n*100);
    if(p<70) anyWeak=true;
    h+=`<tr><td>${t}</td><td>${v.c}/${v.n}</td><td>${p}% ${p<70?"⚠️":""}</td></tr>`;
  });
  h += `</table>${anyWeak?'<p class="small">Fokuskan belajar berikutnya ke topik bertanda ⚠️.</p>':''}
    <button class="btn" onclick="review()">Lihat Pembahasan</button>
    <button class="btn acc" onclick="startExam()">Ulangi (soal diacak)</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}
function review(){
  let h = `<div class="card"><h2>Pembahasan</h2>`;
  order.forEach((qi,i)=>{
    const q=QS[qi], my=ans[qi], ok=my===q.a;
    const oo=q._oo || (q._oo = shuffle(q.o.map((_,i)=>i)));
    h += `<p><strong>${i+1}. [${q.t}]</strong> ${q.q}</p>`;
    h += exhibitHTML(q);
    oo.forEach(oi=>{
      const cls = oi===q.a?'review-correct':(oi===my?'review-wrong':'');
      h += `<div class="opt ${cls}" style="cursor:default">${String.fromCharCode(65+oo.indexOf(oi))}. ${q.o[oi]}${oi===my&&!ok?" ← jawabanmu":""}</div>`;
    });
    h += `<div class="exp"><strong>Pembahasan:</strong> ${q.e}</div><hr style="border:0;border-top:1px solid var(--line)">`;
  });
  h += `<button class="btn acc" onclick="startExam()">Ulangi Ujian</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}
